<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DSO 月结订单系统{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #dfe5ef;
            --text: #1f2937;
            --muted: #64748b;
            --brand: #2563eb;
            --brand-soft: #dbeafe;
            --success: #166534;
            --success-soft: #dcfce7;
            --error: #991b1b;
            --error-soft: #fee2e2;
            --warning: #92400e;
            --warning-soft: #fef3c7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: var(--brand);
            text-decoration: none;
        }

        .layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .nav a {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font-weight: 600;
        }

        .nav a.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }

        .grid {
            display: grid;
            gap: 16px;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .card h2,
        .card h3 {
            margin-top: 0;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 4px;
        }

        .muted {
            color: var(--muted);
        }

        .flash-list {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .flash {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-weight: 600;
        }

        .flash.success {
            background: var(--success-soft);
            border-color: #86efac;
            color: var(--success);
        }

        .flash.error {
            background: var(--error-soft);
            border-color: #fca5a5;
            color: var(--error);
        }

        .flash.warning {
            background: var(--warning-soft);
            border-color: #fcd34d;
            color: var(--warning);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .form-row {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        label {
            font-weight: 600;
            display: grid;
            gap: 6px;
            color: var(--text);
        }

        input,
        textarea,
        select,
        button {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            padding: 11px 12px;
            font: inherit;
            background: #fff;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        button,
        .button {
            cursor: pointer;
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
            font-weight: 700;
        }

        button.secondary,
        .button.secondary {
            background: #fff;
            color: var(--text);
            border-color: var(--line);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .tag {
            display: inline-flex;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: var(--brand-soft);
            color: var(--brand);
        }

        .tag.success {
            background: var(--success-soft);
            color: var(--success);
        }

        .tag.warning {
            background: var(--warning-soft);
            color: var(--warning);
        }

        .table-wrap {
            overflow-x: auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }

        .empty {
            color: var(--muted);
            padding: 12px 0;
        }

        .detail-list {
            display: grid;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px dashed var(--line);
            padding-bottom: 8px;
        }

        @media (max-width: 720px) {
            .header {
                flex-direction: column;
            }

            th,
            td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="header">
            <div>
                <h1>DSO 月结订单系统</h1>
                <p>面向大客户月结场景，不接支付，聚焦客户、订单与对账单。</p>
                <nav class="nav">
                    <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">总览</a>
                    <a href="{{ url_for('customers') }}" class="{% if request.endpoint == 'customers' %}active{% endif %}">客户</a>
                    <a href="{{ url_for('orders') }}" class="{% if request.endpoint == 'orders' %}active{% endif %}">订单</a>
                    <a href="{{ url_for('statements') }}" class="{% if request.endpoint == 'statements' %}active{% endif %}">月结对账单</a>
                </nav>
            </div>
            <div class="card" style="min-width: 260px;">
                <div class="muted">业务设定</div>
                <div class="metric-value">月结</div>
                <div class="muted">客户统一账期管理，不集成在线支付。</div>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-list">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
